  const update = () => {
    const q = inp.value.trim().toLowerCase(); let n = 0;
    rows.forEach(r => { const hit = !q || r.textContent.toLowerCase().includes(q); r.style.display = hit ? "" : "none"; n += hit; });
    content.querySelectorAll(".table-wrap").forEach(w => { w.style.display = [...w.querySelectorAll("tbody tr")].some(r => r.style.display !== "none") ? "" : "none"; });
    $("#idx-n").textContent = `${n} / ${rows.length}`;
  };
  inp.addEventListener("input", update); update();
}

function renderToc() {
  const hs = [...content.querySelectorAll("h2[id]")];
  if (!hs.length) { toc.innerHTML = ""; return; }
  const secH3 = activeH2 ? h3sUnder(activeH2) : [];
  toc.innerHTML = `<div class="toc-t">On this page</div><ul>${hs.map(h => {
    const label = h.querySelector(".h-text").textContent.replace(/#$/, "").replace(/^(\d+\.\d+)/, "$1 ");
    let sub = "";
    if (h.id === activeH2 && secH3.length) sub = `<ul>${secH3.map(e => `<li><a href="#/${current.slug}/${e.id}" data-id="${e.id}">${esc(e.querySelector("code.sig") ? e.querySelector("code.sig").textContent.replace(/\(.*$/s, "") : e.textContent.replace(/#$/, ""))}</a></li>`).join("")}</ul>`;
    return `<li><a href="#/${current.slug}/${h.id}" data-id="${h.id}"${h.id === activeH2 ? ' class="active"' : ""}>${esc(label)}</a>${sub}</li>`;
  }).join("")}</ul>`;
}
function h3sUnder(id) {
  const out = []; let on = false;
  for (const h of content.querySelectorAll("h2[id], h3[id]")) {
    if (h.tagName === "H2") { if (on) break; on = h.id === id; continue; }
    if (on) out.push(h);
  }
  return out;
}

function updateCrumbs() {
  const c = $("#crumbs");
  if (!current) return;
  let html = `<a href="#/home">Lab</a>`;
  if (current.num) html += `<span class="sep">/</span><a href="#/${current.slug}">Part ${current.num}</a>`;
  else if (current.slug === "index") html += `<span class="sep">/</span><span class="cur">Matcher index</span>`;
  const h = activeH2 && document.getElementById(activeH2);
  if (h && current.num) html += `<span class="sep">/</span><span class="cur">${esc(h.querySelector(".h-text").textContent.replace(/#$/, "").replace(/^(\d+\.\d+)/, "$1 "))}</span>`;
  else if (current.num) html += `<span class="sep">/</span><span class="cur">${esc(current.short)}</span>`;
  c.innerHTML = html;
}

/* ================= scroll spy ================= */
let spyQueued = false;
function spy() {
  spyQueued = false;
  if (!current) return;
  const top = 90;
  let h2 = null, h3 = null;
  for (const h of content.querySelectorAll("h2[id], h3[id]")) {
    if (h.getBoundingClientRect().top > top) break;
    if (h.tagName === "H2") { h2 = h; h3 = null; } else h3 = h;
  }
  const id = h2 ? h2.id : null;
  if (id !== activeH2) {
    activeH2 = id;
    renderToc(); updateCrumbs();
    nav.querySelectorAll(".nav-secs a").forEach(a => a.classList.toggle("active", a.dataset.id === id));
  }
  toc.querySelectorAll("ul ul a").forEach(a => a.classList.toggle("active", !!h3 && a.dataset.id === h3.id));
  const act = toc.querySelector("ul ul a.active") || toc.querySelector("a.active");
  if (act) { const r = act.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 20) act.scrollIntoView({ block: "nearest" }); }
  store.set("last", current.slug + (h3 ? "/" + h3.id : id ? "/" + id : ""));
}
addEventListener("scroll", () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(spy); } }, { passive: true });

/* ================= routing ================= */
function route(smooth) {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [slug, anchor] = h.split("/");
  const doc = bySlug[slug] || bySlug.home;
  const changed = doc !== current;
  if (changed) render(doc);
  document.body.classList.remove("side-open");
  const el = anchor && document.getElementById(anchor);
  if (el) {
    const target = el.closest(".entry-card") || el;
    target.scrollIntoView({ behavior: smooth && !changed ? "smooth" : "auto", block: "start" });
    target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
  } else if (changed) scrollTo(0, 0);
  spy();
}
function go(href) {
  if (location.hash !== href) history.pushState(null, "", href);
  route(true);
}
addEventListener("popstate", () => route(false));
addEventListener("hashchange", () => route(false));

/* ================= search ================= */
const SEARCH = [];
for (const d of [...parts, bySlug.index, bySlug.home]) for (const h of outline(d)) {
  if (h.lvl === 1) continue;
  const m = h.text.match(/^`([A-Za-z_]\w*)\(/);
  const ctxLabel = d.num ? `Part ${d.num}${h.parent && h.parent.sec ? " · §" + h.parent.sec : ""}` : d.title;
  if (m) SEARCH.push({ key: m[1].toLowerCase(), label: m[1], sub: `${stripMd(h.text).replace(/^[^—]*—\s*/, "")} · ${ctxLabel}`, href: `#/${d.slug}/${h.id}`, cat: CAT[m[1]] || "section", rank: 0 });
  else SEARCH.push({ key: stripMd(h.text).toLowerCase(), label: stripMd(h.text), sub: d.num ? `Part ${d.num} — ${d.short}` : d.title, href: `#/${d.slug}/${h.id}`, cat: "section", rank: 1 });
}
let results = [], sel = 0;
function doSearch() {
  const q = $("#q").value.trim().toLowerCase();
  if (!q) { renderNav(); return; }
  const scored = [];
  for (const it of SEARCH) {
    const k = it.key.indexOf(q);
    if (k < 0) continue;
    scored.push([(k === 0 ? 0 : 2) + it.rank + (it.key === q ? -1 : 0) + it.key.length / 1000, it]);
  }
  scored.sort((a, b) => a[0] - b[0]);
  results = scored.slice(0, 60).map(s => s[1]); sel = 0;
  const hl = s => { const i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); };
  nav.innerHTML = results.length ? results.map((r, i) =>
    `<a class="res${i === sel ? " sel" : ""}" href="${r.href}"><i class="dot ${r.cat}"></i><span class="rn">${hl(r.label)}</span><span class="rs">${esc(r.sub)}</span></a>`).join("")
    : `<div class="res-empty">No matcher or section matches “${esc(q)}”.</div>`;
}
$("#q").addEventListener("input", doSearch);
$("#q").addEventListener("keydown", e => {
  const items = nav.querySelectorAll(".res");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!items.length) return;
    sel = (sel + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
    items.forEach((a, i) => a.classList.toggle("sel", i === sel)); items[sel].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter" && results[sel]) {
    go(results[sel].href);
  } else if (e.key === "Escape") { e.target.value = ""; doSearch(); e.target.blur(); }
});

/* ================= sample drawer ================= */
const drawer = $("#drawer"), scrim = $("#scrim"), drFile = $("#dr-file");
drFile.innerHTML = Object.keys(DATA.samples).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
const sampleHtml = {};
function flagsFor(file) {
  const all = CODES.map(c => c.sample).concat(parts.map(d => d.sample));
  const s = all.find(s => s && resolveSample(s.file) === file);
  return s ? s.flags : null;
}
function openSample(file, line, end) {
  file = resolveSample(file); if (!file) return;
  drFile.value = file;
  const lang = file.endsWith(".query") ? "query" : "cpp";
  if (!sampleHtml[file]) sampleHtml[file] = toksLines(highlight(DATA.samples[file], lang)).map((l, i) => `<div class="ln" data-n="${i + 1}"><span class="n">${i + 1}</span><span class="s">${l || " "}</span></div>`).join("");
  const body = $("#dr-body");
  if (body.dataset.file !== file) { body.innerHTML = sampleHtml[file]; body.dataset.file = file; }
  body.querySelectorAll(".ln.hl").forEach(l => l.classList.remove("hl"));
  const flags = flagsFor(file);
  const cmd = `$LLVM/bin/clang-query ${file} -- ${flags || "-std=c++23"}`;
  $("#dr-flags").innerHTML = `<span>${esc(file.endsWith(".query") ? "clang-query -f " + file : "flags: " + (flags || "—"))}</span>${file.endsWith(".query") ? "" : `<button class="cb-btn" id="dr-copy" title="${esc(cmd)}">Copy REPL command</button>`}`;
  const dc = $("#dr-copy"); if (dc) dc.onclick = async () => { if (await copyText(cmd)) toast("Copied REPL command"); };
  drawer.classList.add("open"); scrim.classList.add("on");
  if (line) {
    const a = +line, b = Math.max(a, +(end || line));
    for (let n = a; n <= b; n++) { const el = body.querySelector(`.ln[data-n="${n}"]`); if (el) el.classList.add("hl"); }
    const el = body.querySelector(`.ln[data-n="${a}"]`);
    if (el) requestAnimationFrame(() => body.scrollTop = el.offsetTop - body.clientHeight / 3);
  } else body.scrollTop = 0;
}
function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("on"); }
drFile.addEventListener("change", () => openSample(drFile.value));
$("#dr-close").onclick = closeDrawer;
scrim.onclick = () => { closeDrawer(); document.body.classList.remove("side-open"); scrim.classList.remove("on"); };
$("#sample-pill").onclick = () => current && current.sample && openSample(current.sample.file);

/* ================= tooltip ================= */
const tip = $("#tip");
let tipFor = null, tipHide = null;
function showTip(el) {
  const name = el.dataset.m, rows = DATA.catalog[name];
  if (!rows) return;
  clearTimeout(tipHide);
  if (tipFor === el && tip.classList.contains("on")) return;
  tipFor = el;
  const ents = ENTRIES[name] || [];
  tip.innerHTML = rows.slice(0, 4).map(r =>
    `<div class="tip-row"><div class="tip-sig"><span class="r">${esc(r.r)}</span> <b class="${catCls(r.s)}">${esc(name)}</b>(${esc(r.p)})</div>
     <div class="tip-meta"><span class="cat-tag ${r.s}">${r.s}</span>${r.ok ? "" : '<span class="badge-bad">not in clang-query 22</span>'}</div>
     <pre class="tip-doc">${esc(r.d)}</pre></div>`).join("") +
    (rows.length > 4 ? `<div class="tip-meta" style="color:var(--muted)">+${rows.length - 4} more overloads</div>` : "") +
    (ents.length ? `<div class="tip-links">${ents.slice(0, 6).map(e => `<a href="#/${e.doc.slug}/${e.id}">Part ${e.doc.num}${e.sec && e.sec.sec ? " §" + e.sec.sec : ""} →</a>`).join("")}</div>` : "");
  tip.classList.add("on");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(Math.max(12, r.left), innerWidth - tw - 12);
  let y = r.bottom + 8;
  if (y + th > innerHeight - 12) y = Math.max(12, r.top - th - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTipSoon() { clearTimeout(tipHide); tipHide = setTimeout(() => { tip.classList.remove("on"); tipFor = null; }, 220); }
document.addEventListener("mouseover", e => {
  const tn = e.target.closest(".tree .tn");
  const fig = e.target.closest("figure.dg");
  if (fig) {
    fig.querySelectorAll(".on-path, .hot").forEach(x => x.classList.remove("on-path", "hot"));
    if (tn) {
      for (let li = tn.parentElement; li; li = li.parentElement.closest(".tree li")) li.classList.add("on-path");
      const path = treeStatus(tn);
      fig.querySelector(".dg-status").innerHTML = path.length > 1 ? path.map((p, i) => i === path.length - 1 ? `<b>${esc(p)}</b>` : esc(p)).join(" › ") : "";
    }
    const g = e.target.closest("[data-g]");
    if (g) fig.querySelectorAll(`[data-g="${g.dataset.g}"]`).forEach(x => x.classList.add("hot"));
    const r = e.target.closest("[data-r]");
    if (r) fig.querySelectorAll(`[data-r="${r.dataset.r}"]`).forEach(x => x.classList.add("hot"));
    const fk = e.target.closest(".fam-k");
    if (fk) applyFam(fk);
  }
  const el = e.target.closest("[data-m]");
  if (el && !drawer.contains(el)) { clearTimeout(tipHide); tipHide = setTimeout(() => showTip(el), 260); }
  else if (tip.contains(e.target)) clearTimeout(tipHide);
  else if (tip.classList.contains("on") || tipHide) hideTipSoon();
});
tip.addEventListener("click", e => { if (e.target.closest("a")) { tip.classList.remove("on"); tipFor = null; } });

/* ================= clicks ================= */
document.addEventListener("click", async e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); go(a.getAttribute("href")); return; }
  const tw = e.target.closest(".tw");
  if (tw) { tw.closest("li").classList.toggle("collapsed"); return; }
  const dgb = e.target.closest("[data-dg]");
  if (dgb) {
    const fig = dgb.closest("figure.dg"), act = dgb.dataset.dg;
    if (act === "ascii") { fig.classList.toggle("ascii"); dgb.classList.toggle("on", fig.classList.contains("ascii")); }
    else fig.querySelectorAll(".tree li").forEach(li => li.classList.toggle("collapsed", act === "collapse" && !!li.querySelector("ul") && !!li.parentElement.closest("li")));
    return;
  }
  const fk = e.target.closest(".fam-k");
  if (fk) { applyFam(fk); return; }
  const gp = e.target.closest("[data-go]");
  if (gp && ENTRIES[gp.dataset.go]) { const en = ENTRIES[gp.dataset.go][0]; tip.classList.remove("on"); go(`#/${en.doc.slug}/${en.id}`); return; }
  const f = e.target.closest("[data-file]");
  if (f && !e.target.closest("#drawer")) { openSample(f.dataset.file, f.dataset.line, f.dataset.end); return; }
  const b = e.target.closest(".cb-btn[data-act]");
  if (b) {
    const c = CODES[+b.dataset.i];
    const text = b.dataset.act === "shot" ? oneShot(c) : c.code;
    if (await copyText(text)) {
      toast(b.dataset.act === "shot" ? "Copied shell command — run it from the lab root" : "Copied to clipboard");
      b.classList.add("ok"); setTimeout(() => b.classList.remove("ok"), 1200);
    }
    return;
  }
  const d = e.target.closest(".done-btn");
  if (d) {
    const s = d.dataset.sec; done[s] = !done[s]; if (!done[s]) delete done[s];
    store.set("done", done);
    d.classList.toggle("on", !!done[s]);
    renderNav();
    if (done[s]) toast(`§${s} marked done`);
    return;
  }
  const m = e.target.closest("[data-m]");
  if (m && matchMedia("(hover: none)").matches) { showTip(m); return; }
  if (!tip.contains(e.target)) { tip.classList.remove("on"); tipFor = null; }
});
function setCollapsed(on) {
  document.body.classList.toggle("side-collapsed", on);
  store.set("collapsed", on);
}
function toggleSidebar() {
  if (innerWidth <= 900) { document.body.classList.add("side-open"); scrim.classList.add("on"); }
  else setCollapsed(!document.body.classList.contains("side-collapsed"));
}
setCollapsed(!!store.get("collapsed", false));
$("#menu-btn").onclick = toggleSidebar;
$("#collapse-btn").onclick = () => setCollapsed(true);

/* ================= keyboard ================= */
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || e.key === "/") { e.preventDefault(); if (innerWidth <= 900) { document.body.classList.add("side-open"); scrim.classList.add("on"); } $("#q").focus(); $("#q").select(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const seq = [bySlug.home, ...parts, bySlug.index], k = seq.indexOf(current);
  if (e.key === "]" && seq[k + 1]) go("#/" + seq[k + 1].slug);
  else if (e.key === "[" && seq[k - 1]) go("#/" + seq[k - 1].slug);
  else if (e.key === "j" || e.key === "k") {
    const hs = [...content.querySelectorAll("h2[id]")];
    const i = hs.findIndex(h => h.id === activeH2);
    const t = e.key === "j" ? hs[i + 1] : (i > 0 ? hs[i - 1] : null);
    if (t) go(`#/${current.slug}/${t.id}`);
  } else if (e.key === "b") toggleSidebar();
  else if (e.key === "e") { const all = [...content.querySelectorAll("details.explain")]; const open = !all.some(d => d.open); all.forEach(d => d.open = open); }
  else if (e.key === "s" && current && current.sample) openSample(current.sample.file);
  else if (e.key === "Escape") { closeDrawer(); tip.classList.remove("on"); document.body.classList.remove("side-open"); }
});

/* ================= boot ================= */
// Pre-scan each part once so sample flags / defaults are known before it is opened.
for (const d of parts) { const m = d.md.match(/^\*\*Sample:\*\*\s*`([^`]+)`\s*·\s*flags:\s*`([^`]*)`/m); if (m) d.sample = { file: m[1], flags: m[2] }; }
if (!location.hash) history.replaceState(null, "", "#/home");
route(false);
})();
</script>
</body>
