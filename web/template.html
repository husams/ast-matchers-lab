<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AST Matchers Lab</title>
<style>
:root {
  --bg: #0e1116;
  --bg-2: #12161d;
  --surface: #161b23;
  --surface-2: #1b212b;
  --surface-3: #222a36;
  --border: #252d39;
  --border-2: #2f3947;
  --text: #d6dce5;
  --text-2: #aab4c3;
  --muted: #7d8898;
  --faint: #56606e;
  --accent: #7aa2f7;
  --accent-2: #9ab8ff;
  --accent-bg: rgba(122,162,247,.12);
  --code-bg: #0b0e13;
  --code-head: #10141a;
  --ok: #73daca;
  --ok-bg: rgba(115,218,202,.08);
  --warn: #e0af68;
  --warn-bg: rgba(224,175,104,.08);
  --bad: #f7768e;
  --bad-bg: rgba(247,118,142,.08);
  --violet: #bb9af7;
  --violet-bg: rgba(187,154,247,.08);

  /* syntax */
  --t-node: #7aa2f7;
  --t-narrow: #9ece6a;
  --t-trav: #bb9af7;
  --t-cmd: #f7768e;
  --t-opt: #ff9e64;
  --t-val: #7dcfff;
  --t-str: #e0c285;
  --t-num: #ff9e64;
  --t-com: #5f6b7c;
  --t-var: #73daca;
  --t-kw: #bb9af7;
  --t-type: #2ac3de;
  --t-fn: #82aaff;
  --t-pp: #f7768e;

  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --side-w: 296px;
  --toc-w: 248px;
  --top-h: 56px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top-h) + 16px); }
#content [id], .entry-card { scroll-margin-top: calc(var(--top-h) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.68 var(--sans); -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
::selection { background: rgba(122,162,247,.3); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2a3240; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: #3a4556; }
::-webkit-scrollbar-track { background: transparent; }
button { font: inherit; color: inherit; }
kbd {
  font: 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px;
  background: var(--surface-3); border: 1px solid var(--border-2); border-bottom-width: 2px; color: var(--text-2);
}

/* ---------- layout ---------- */
#app { --sw: var(--side-w); display: grid; grid-template-columns: var(--sw) minmax(0,1fr) var(--toc-w); min-height: 100vh; transition: grid-template-columns .22s ease; }
body.side-collapsed #app { --sw: 0px; }
body.side-collapsed #sidebar { visibility: hidden; border-right: 0; }
#sidebar { min-width: 0; }
@media (min-width: 901px) { #sidebar > * { min-width: var(--side-w); } }
#sidebar {
  position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  background: var(--bg-2); border-right: 1px solid var(--border);
}
#main { min-width: 0; }
#toc { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: calc(var(--top-h) + 20px) 18px 40px 8px; }

/* ---------- sidebar ---------- */
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.brand-logo {
  width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: linear-gradient(135deg, #7aa2f7, #bb9af7); color: #0e1116; font: 700 13px/1 var(--mono);
}
.brand-t { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand-s { font-size: 12px; color: var(--muted); }
.search { position: relative; margin: 4px 14px 10px; }
.search input {
  width: 100%; padding: 9px 12px 9px 34px; border-radius: 9px; border: 1px solid var(--border-2);
  background: var(--surface); color: var(--text); font: 14px var(--sans); outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); }
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
#nav { flex: 1; overflow-y: auto; padding: 4px 10px 20px; }
.nav-group { margin: 14px 8px 6px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px;
  color: var(--text-2); font-size: 14px; line-height: 1.35;
}
.nav-item:hover { background: var(--surface); color: var(--text); text-decoration: none; }
.nav-item.active { background: var(--accent-bg); color: var(--text); }
.nav-num {
  flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--muted); font: 600 11px/1 var(--mono);
}
.nav-item.active .nav-num { background: var(--accent); color: #0e1116; }
.nav-item.complete .nav-num { background: rgba(115,218,202,.18); color: var(--ok); }
.nav-t { flex: 1; min-width: 0; }
.nav-ring { flex: none; }
.nav-secs { list-style: none; margin: 2px 0 8px 20px; padding: 0 0 0 12px; border-left: 1px solid var(--border-2); }
.nav-secs a {
  display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px;
  font-size: 13px; color: var(--muted); line-height: 1.4;
}
.nav-secs a:hover { color: var(--text); background: var(--surface); text-decoration: none; }
.nav-secs a.active { color: var(--accent-2); background: var(--surface); }
.nav-secs .sn { font: 500 11.5px var(--mono); color: var(--faint); flex: none; }
.nav-secs a.done .sn { color: var(--ok); }
.nav-secs a.done .sn::before { content: "✓ "; }
.side-foot { border-top: 1px solid var(--border); padding: 12px 18px 14px; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.node { background: var(--t-node); } .dot.narrowing { background: var(--t-narrow); } .dot.traversal { background: var(--t-trav); }
.dot.section { background: var(--muted); }
.keys { display: flex; gap: 10px; flex-wrap: wrap; color: var(--faint); }
.overall { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.bar { flex: 1; height: 4px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--accent)); border-radius: 4px; }

/* search results */
.res {
  display: grid; grid-template-columns: 10px 1fr; gap: 2px 10px; align-items: center;
  padding: 7px 10px; border-radius: 8px; color: var(--text-2);
}
.res:hover, .res.sel { background: var(--surface-2); color: var(--text); text-decoration: none; }
.res .rn { font: 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .rs { grid-column: 2; font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res mark { background: none; color: var(--accent-2); font-weight: 700; }
.res-empty { padding: 20px 12px; color: var(--muted); font-size: 13px; }

/* ---------- top bar ---------- */
#topbar {
  position: sticky; top: 0; z-index: 20; height: var(--top-h); display: flex; align-items: center; gap: 12px;
  padding: 0 28px; background: rgba(14,17,22,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
#menu-btn { display: inline-grid; }
.brand-row { display: flex; align-items: center; }
.brand-row .brand { flex: 1; min-width: 0; }
#collapse-btn { margin-right: 12px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
  background: transparent; border: 1px solid transparent; color: var(--text-2); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--text); }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--text-2); }
.crumbs .sep { color: var(--faint); }
.crumbs .cur { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  font-size: 13px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border-2); white-space: nowrap;
}
.pill:hover { border-color: var(--accent); color: var(--text); text-decoration: none; }
.pill svg { color: var(--muted); }

/* ---------- content ---------- */
#content { max-width: 880px; margin: 0 auto; padding: 36px 40px 40px; }
.doc-head { margin: 8px 0 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.doc-head h1 { font-size: 34px; line-height: 1.2; letter-spacing: -.02em; margin: 0; font-weight: 700; }
.doc-meta { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
.doc-meta .chip { padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
h1, h2, h3, h4 { color: #eef1f6; }
#content h2 {
  font-size: 24px; letter-spacing: -.015em; line-height: 1.3; margin: 56px 0 16px; padding-top: 22px;
  border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
}
#content h2 .h-text { flex: 1; }
#content h3 { font-size: 18px; margin: 32px 0 12px; line-height: 1.4; }
#content h4 { font-size: 15.5px; margin: 24px 0 8px; color: var(--text-2); }
.anchor { opacity: 0; color: var(--faint); font-weight: 400; margin-left: 6px; font-size: .8em; }
h2:hover .anchor, h3:hover .anchor { opacity: 1; }
.sec-num { font: 600 .72em var(--mono); color: var(--accent); background: var(--accent-bg); padding: 3px 8px; border-radius: 6px; margin-right: 10px; vertical-align: 3px; }
.done-btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 9px; border-radius: 999px;
  font: 500 12.5px var(--sans); cursor: pointer; background: var(--surface); color: var(--muted); border: 1px solid var(--border-2);
}
.done-btn:hover { color: var(--text); border-color: var(--ok); }
.done-btn .box { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 10px; line-height: 1; }
.done-btn.on { background: var(--ok-bg); color: var(--ok); border-color: rgba(115,218,202,.4); }
.done-btn.on .box { background: var(--ok); border-color: var(--ok); color: #0e1116; }
.done-btn.on .box::after { content: "✓"; font-weight: 800; }

p { margin: 0 0 16px; }
ul, ol { padding-left: 24px; margin: 0 0 16px; }
li { margin: 5px 0; }
li > ul, li > ol { margin: 6px 0; }
li::marker { color: var(--faint); }
ul.tasks { list-style: none; padding-left: 4px; }
strong { color: #f1f4f8; font-weight: 650; }
em { color: var(--text); }
hr { border: 0; border-top: 1px solid var(--border); margin: 36px 0; }
blockquote { margin: 0 0 16px; padding: 10px 18px; border-left: 3px solid var(--border-2); color: var(--text-2); background: var(--surface); border-radius: 0 8px 8px 0; }
blockquote > :last-child { margin-bottom: 0; }

code {
  font: .86em var(--mono); padding: .14em .42em; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--border); color: #e3e8ef;
}
code.fileref { cursor: pointer; color: var(--t-str); border-style: dashed; border-color: rgba(224,194,133,.35); }
code.fileref:hover { background: rgba(224,194,133,.1); }
code.mref { cursor: help; }
a code { color: inherit; }

/* entry cards (one per reference matcher) */
.entry-card {
  margin: 22px 0; padding: 4px 22px 6px; border: 1px solid var(--border); border-radius: 12px;
  background: linear-gradient(180deg, var(--bg-2), var(--bg) 70%);
}
.entry-card.flash, h2.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 2px transparent; } }
#content h3.entry { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 16px 0 10px; }
h3.entry code.sig { font-size: 15px; padding: 4px 10px; background: var(--code-bg); border-color: var(--border-2); }
h3.entry .ret { font: 500 12.5px var(--mono); color: var(--muted); }
.cat-tag { font: 600 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; }
.cat-tag.node { color: var(--t-node); background: rgba(122,162,247,.12); }
.cat-tag.narrowing { color: var(--t-narrow); background: rgba(158,206,106,.12); }
.cat-tag.traversal { color: var(--t-trav); background: rgba(187,154,247,.12); }

/* special paragraphs */
.samplebar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 14px; margin: 0 0 20px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--muted);
}
.samplebar strong { color: var(--text-2); font-weight: 600; }
p.expected {
  padding: 10px 14px 10px 14px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--ok);
  background: var(--ok-bg); color: var(--text-2); font-size: 15px;
}
p.expected > strong:first-child { color: var(--ok); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
p.notin { padding: 10px 14px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--text-2); }
p.notin > strong:first-child { color: var(--warn); }
p.quiz {
  margin-top: 28px; padding: 16px 18px 16px 18px; border-radius: 12px; border: 1px solid rgba(187,154,247,.35);
  background: var(--violet-bg); color: var(--text);
}
p.quiz > strong:first-child {
  display: inline-block; margin-right: 8px; padding: 2px 9px; border-radius: 6px; font-size: 11.5px; letter-spacing: .08em;
  text-transform: uppercase; background: var(--violet); color: #0e1116;
}

/* callouts */
.callout { margin: 0 0 14px; border: 1px solid var(--border-2); border-left: 3px solid var(--c, var(--accent)); border-radius: 0 10px 10px 0; background: var(--cb, var(--surface)); }
.callout > summary, .callout > .callout-title {
  display: flex; align-items: center; gap: 9px; padding: 10px 14px; font-weight: 600; font-size: 14.5px; color: var(--c, var(--accent));
  list-style: none; cursor: pointer; user-select: none;
}
.callout > .callout-title { cursor: default; }
.callout > summary::-webkit-details-marker { display: none; }
.callout > summary::after { content: "›"; margin-left: auto; font-size: 20px; line-height: 1; transition: transform .15s; color: var(--muted); }
.callout[open] > summary::after { transform: rotate(90deg); }
.callout > summary:hover { background: rgba(255,255,255,.02); }
.callout-body { padding: 2px 16px 4px; color: var(--text-2); }
.callout-body > :last-child { margin-bottom: 12px; }
.callout-hint { --c: var(--warn); --cb: var(--warn-bg); }
.callout-success { --c: var(--ok); --cb: var(--ok-bg); }
.callout-warning { --c: var(--bad); --cb: var(--bad-bg); }
.callout-note { --c: var(--accent); --cb: var(--accent-bg); }
.callout-example { --c: var(--violet); --cb: var(--violet-bg); }
.ci { width: 16px; height: 16px; flex: none; }

/* tables */
.table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { background: var(--surface); color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255,255,255,.015); }
td code, .card-d code, p.expected code { white-space: nowrap; }

/* code blocks */
figure.code { margin: 0 0 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
figure.code figcaption {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; background: var(--code-head);
  border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); min-height: 36px;
}
.lang { font: 600 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.lang.cq { color: var(--accent); }
.cb-sample { font: 11.5px var(--mono); color: var(--t-str); background: none; border: 0; padding: 2px 6px; border-radius: 5px; cursor: pointer; }
.cb-sample:hover { background: rgba(224,194,133,.1); }
.cb-actions { margin-left: auto; display: flex; gap: 4px; }
.cb-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; cursor: pointer;
  background: transparent; border: 1px solid transparent; font-size: 12px; color: var(--muted);
}
.cb-btn:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--text); }
.cb-btn.ok { color: var(--ok); }
figure.code pre { margin: 0; padding: 14px 18px; overflow-x: auto; font: 13.5px/1.62 var(--mono); color: #cdd6e3; tab-size: 4; }
figure.code pre code { font: inherit; padding: 0; background: none; border: 0; color: inherit; }
figure.code.warn-block { border-color: rgba(247,118,142,.25); }

.t-node { color: var(--t-node); } .t-narrow { color: var(--t-narrow); } .t-trav { color: var(--t-trav); }
.t-cmd { color: var(--t-cmd); font-weight: 600; } .t-opt { color: var(--t-opt); } .t-val { color: var(--t-val); }
.t-str { color: var(--t-str); } .t-num { color: var(--t-num); } .t-com { color: var(--t-com); font-style: italic; }
.t-var { color: var(--t-var); } .t-kw { color: var(--t-kw); } .t-type { color: var(--t-type); }
.t-fn { color: var(--t-fn); } .t-pp { color: var(--t-pp); } .t-meth { color: var(--warn); font-style: italic; }
.t-flag { color: var(--t-val); } .t-bad { color: var(--bad); }
[data-m] { cursor: help; border-radius: 3px; }
[data-m]:hover { background: rgba(255,255,255,.07); }

/* pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 56px 0 20px; }
.pager a {
  display: block; padding: 14px 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-2); color: var(--text);
}
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager .pl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pager .next { text-align: right; grid-column: 2; }

/* home */
.hero { margin: 8px 0 34px; }
.hero h1 { font-size: 40px; letter-spacing: -.025em; line-height: 1.12; margin: 0 0 14px; }
.hero h1 span { background: linear-gradient(90deg, #7aa2f7, #bb9af7); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--text-2); font-size: 17px; max-width: 640px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 14px;
  border: 1px solid var(--border-2); background: var(--surface); color: var(--text); cursor: pointer;
}
.btn:hover { text-decoration: none; border-color: var(--accent); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0e13; }
.btn.primary:hover { background: var(--accent-2); color: #0b0e13; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 26px 0 0; }
.stat b { display: block; font-size: 24px; letter-spacing: -.02em; color: #eef1f6; }
.stat span { font-size: 12.5px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin: 0 0 40px; }
.card {
  display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg-2); color: var(--text);
}
.card:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-1px); }
.card-top { display: flex; align-items: center; gap: 10px; }
.card .nav-num { width: 28px; height: 28px; font-size: 12px; }
.card-g { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; font-weight: 650; }
.card-t { font-weight: 650; font-size: 15px; line-height: 1.35; }
.card-d { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; }
.card-d code { font-size: 11.5px; }
.card-p { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

/* matcher index filter */
.idx-filter { position: sticky; top: calc(var(--top-h) + 8px); z-index: 5; display: flex; gap: 8px; margin: 0 0 20px; padding: 8px; border-radius: 12px; background: rgba(18,22,29,.9); border: 1px solid var(--border); backdrop-filter: blur(8px); }
.idx-filter input { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface); color: var(--text); font: 14px var(--mono); outline: none; }
.idx-filter input:focus { border-color: var(--accent); }
.idx-filter span { align-self: center; font-size: 12.5px; color: var(--muted); padding: 0 8px; white-space: nowrap; }

/* toc */
.toc-t { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px 12px; }
#toc ul { list-style: none; margin: 0; padding: 0; }
#toc a { display: block; padding: 4px 10px 4px 12px; border-left: 2px solid var(--border); font-size: 13px; color: var(--muted); line-height: 1.4; }
#toc a:hover { color: var(--text); text-decoration: none; }
#toc a.active { color: var(--accent-2); border-left-color: var(--accent); }
#toc ul ul a { padding-left: 24px; font: 12px var(--mono); }
#toc ul ul a.active { color: var(--text); border-left-color: var(--accent-2); }

/* drawer */
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); z-index: 40; display: flex; flex-direction: column;
  background: var(--bg-2); border-left: 1px solid var(--border-2); box-shadow: -24px 0 60px rgba(0,0,0,.45);
  transform: translateX(105%); transition: transform .22s ease;
}
#drawer.open { transform: none; }
.dr-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.dr-head select {
  flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface);
  color: var(--text); font: 13px var(--mono); outline: none;
}
.dr-flags { padding: 8px 16px; font: 12px var(--mono); color: var(--muted); border-bottom: 1px solid var(--border); background: var(--code-head); display: flex; gap: 8px; align-items: center; }
.dr-flags .cb-btn { margin-left: auto; }
#dr-body { flex: 1; overflow: auto; background: var(--code-bg); font: 13px/1.6 var(--mono); padding: 10px 0 40px; }
.ln { display: flex; white-space: pre; padding-right: 20px; min-width: max-content; }
.ln .n { flex: none; width: 52px; padding-right: 14px; text-align: right; color: var(--faint); user-select: none; }
.ln .s { color: #cdd6e3; }
.ln.hl { background: rgba(122,162,247,.13); box-shadow: inset 3px 0 0 var(--accent); }
.ln.hl .n { color: var(--accent-2); }
#scrim { position: fixed; inset: 0; z-index: 30; background: rgba(4,6,9,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
#scrim.on { opacity: 1; pointer-events: auto; }

/* tooltip */
#tip {
  position: fixed; z-index: 60; width: min(460px, calc(100vw - 24px)); max-height: 360px; overflow: auto; display: none;
  background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  padding: 12px 14px; font-size: 13px;
}
#tip.on { display: block; }
.tip-row + .tip-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.tip-sig { font: 12.5px/1.5 var(--mono); color: var(--text); word-break: break-word; }
.tip-sig .r { color: var(--muted); }
.tip-meta { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.tip-doc { white-space: pre-wrap; color: var(--text-2); font: 12px/1.55 var(--mono); margin: 6px 0 0; max-height: 150px; overflow: auto; }
.tip-links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.tip-links a { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--accent-bg); }
.tip-links a:hover { text-decoration: none; background: rgba(122,162,247,.22); }
.badge-bad { color: var(--bad); background: var(--bad-bg); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }

#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); z-index: 70; opacity: 0; pointer-events: none;
  background: var(--surface-3); border: 1px solid var(--border-2); color: var(--text); padding: 9px 16px; border-radius: 10px;
  font-size: 13px; transition: .2s; box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- diagrams (ASCII illustrations rendered graphically) ---------- */
figure.dg {
  --line: #34404f;
  margin: 0 0 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  background: radial-gradient(120% 90% at 0% 0%, rgba(122,162,247,.05), transparent 60%), var(--bg-2);
}
figure.dg figcaption {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; min-height: 36px;
  background: rgba(16,20,26,.7); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted);
}
figure.dg .lang { color: var(--violet); }
.dg-status { font: 11.5px var(--mono); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dg-status b { color: var(--accent-2); font-weight: 600; }
.dg-body { padding: 18px 20px; overflow-x: auto; }
.dg-ascii { margin: 0; padding: 14px 18px; font: 12.5px/1.55 var(--mono); color: var(--text-2); overflow-x: auto; background: var(--code-bg); }
figure.dg:not(.ascii) .dg-ascii, figure.dg.ascii .dg-body { display: none; }
.cb-btn.on { color: var(--accent-2); border-color: var(--border-2); background: var(--surface-2); }
.dg-caption { margin: 0 0 14px; }

.cls {
  display: inline-flex; align-items: center; font: 12.5px/1 var(--mono); padding: 5px 8px; border-radius: 6px; white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text-2); transition: background .12s, border-color .12s;
}
.cls.has-m { color: #b8ccff; border-color: rgba(122,162,247,.35); background: rgba(122,162,247,.08); cursor: pointer; }
.cls.has-m:hover { background: rgba(122,162,247,.2); border-color: var(--t-node); }
.cls.ann { border-color: var(--t-node); box-shadow: 0 0 0 1px rgba(122,162,247,.25); font-weight: 600; }
.dg-code { font: 12.5px/1.45 var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--border); color: #cdd6e3; white-space: pre; display: inline-block; }
.dg-note { color: var(--muted); font-size: 12.5px; font-style: italic; }
.dg-txt { color: var(--text-2); font-size: 13.5px; }
.dg-grp { color: var(--text); font-weight: 650; font-size: 13.5px; }
.dg-arr { color: var(--muted); margin: 0 3px; font-size: 13px; }
.dg-sep { color: var(--faint); margin: 0 3px; }
.dg-muted { color: var(--faint); }
.dg-num { font: 600 12px var(--mono); color: var(--t-num); background: rgba(255,158,100,.1); padding: 3px 8px; border-radius: 5px; }
.dg-ok { color: var(--ok); font-weight: 800; } .dg-bad { color: var(--bad); font-weight: 800; }

/* tree */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree li { margin: 0; }
.tree ul { padding-left: 9px; }
.tree ul > li { position: relative; padding-left: 24px; }
.tree ul > li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--line); }
.tree ul > li:last-child::before { bottom: auto; height: 20px; }
.tree ul > li::after { content: ""; position: absolute; left: 0; top: 20px; width: 20px; border-top: 1.5px solid var(--line); }
.tree li.on-path::after { border-top-color: var(--accent); }
.tree li.on-path > .tn > .cls:first-of-type { border-color: var(--accent); color: #fff; }
.tn { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 40px; padding: 3px 0; }
.tw {
  flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; cursor: pointer; padding: 0;
  background: var(--surface-3); border: 1px solid var(--border-2); color: var(--muted); font-size: 10px; line-height: 1; transition: transform .15s;
}
.tw:hover { color: var(--text); border-color: var(--accent); }
.tw-sp { flex: none; width: 20px; height: 20px; display: grid; place-items: center; }
.tw-sp::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
li.collapsed > .tn > .tw { transform: rotate(-90deg); }
li.collapsed > ul { display: none; }
.tw-n { display: none; font: 11px var(--mono); color: var(--faint); }
li.collapsed > .tn > .tw-n { display: inline; }
.dg:has(.scope-note:hover) .cls { border-color: var(--t-narrow); color: var(--t-narrow); }
.scope-note { margin-top: 14px; padding: 9px 12px; border-radius: 9px; border: 1px dashed rgba(158,206,106,.4); background: rgba(158,206,106,.06); font-size: 13px; color: var(--text-2); cursor: default; }

/* table */
.dg-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
.dg-table th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 650; padding: 0 12px 10px; border-bottom: 1px solid var(--border-2); white-space: nowrap; }
.dg-table td { white-space: nowrap; padding: 9px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
.dg-table tr:first-child td { border-top: 0; }
.dg-table tr.cont td { border-top-color: transparent; padding-top: 2px; }
.dg-table tbody tr:hover td { background: rgba(255,255,255,.02); }
.dg-table td > * + * { margin-left: 6px; }

/* annotated lines */
.ann { display: grid; grid-template-columns: max-content auto 1fr; gap: 6px 12px; align-items: center; }
.ann-code { font: 13.5px var(--mono); white-space: pre; color: #cdd6e3; padding: 3px 0; }
.ann-arrow { color: var(--faint); }
.ann-note { font-size: 13px; color: var(--text-2); }
.ann > .hot { background: rgba(122,162,247,.07); border-radius: 6px; }

/* anatomy (segmented source/matcher) */
.anat { display: grid; column-gap: 6px; row-gap: 8px; width: max-content; margin: 6px auto; align-items: start; }
.an-code code { display: block; text-align: center; font-size: 14.5px; padding: 7px 10px; background: var(--code-bg); border: 1px solid var(--border-2); border-radius: 7px; white-space: pre; transition: border-color .12s; }
.an-lbl { border-top: 3px solid var(--k); padding-top: 7px; font-size: 12px; font-weight: 650; color: var(--k); text-align: center; line-height: 1.4; }
.an-lbl .an-sub { display: block; white-space: pre-line; margin-top: 4px; font: 400 11.5px/1.5 var(--mono); color: var(--text-2); }
.k-node { --k: var(--t-node); } .k-narrowing { --k: var(--t-narrow); } .k-traversal { --k: var(--t-trav); } .k-other { --k: var(--warn); } .k-plain { --k: transparent; }
.anat .hot code { border-color: var(--k); box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 18%, transparent); }
.an-lbl.hot { filter: brightness(1.25); }
.an-frame { display: flex; flex-direction: column; align-items: center; }
.an-frame i { align-self: stretch; height: 12px; border: 1.5px dashed var(--line); border-top: 0; border-radius: 0 0 10px 10px; }
.an-frame span { margin-top: 6px; font-size: 12px; color: var(--muted); text-align: center; }

/* flow */
.flow { display: flex; flex-direction: column; align-items: flex-start; }
.fl-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0 4px; }
.fl-box { padding: 11px 15px; border-radius: 11px; border: 1px solid var(--border-2); background: var(--surface); min-width: 230px; max-width: 460px; }
.fl-box.me { border-color: var(--accent); background: var(--accent-bg); }
.fl-t { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: 650; color: var(--text); }
.fl-d { margin-top: 5px; font-size: 13px; color: var(--muted); }
.fl-tag { font: 600 10.5px var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); padding: 2px 7px; border-radius: 5px; }
.fl-edge { position: relative; margin-left: 30px; padding: 12px 0 12px 20px; border-left: 2px solid var(--line); font-size: 12.5px; color: var(--text-2); display: flex; flex-direction: column; gap: 4px; }
.fl-edge::after { content: ""; position: absolute; left: -7px; bottom: -3px; border: 6px solid transparent; border-top: 8px solid var(--line); border-bottom: 0; }
.fl-link { display: flex; align-items: center; padding: 0 10px; color: var(--muted); font-size: 12px; gap: 6px; }
.fl-link::before, .fl-link::after { content: ""; width: 22px; border-top: 2px solid var(--line); }
.fl-link::after { width: 14px; border-top: 0; border-left: 8px solid var(--line); border-top: 6px solid transparent; border-bottom: 6px solid transparent; height: 0; }

/* cards */
.dg-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.dg-card { padding: 14px; border-radius: 11px; border: 1px solid var(--border-2); background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.dg-card .dg-code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
.dg-q { font-size: 14px; color: var(--text); font-weight: 600; flex: 1; }
.dg-secs { display: flex; gap: 6px; }
.dg-secs a { font: 600 12px var(--mono); padding: 3px 9px; border-radius: 6px; background: var(--accent-bg); }
.dg-secs a:hover { text-decoration: none; background: rgba(122,162,247,.22); }

/* compare */
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.cmp-c { border: 1px solid var(--border-2); border-radius: 11px; padding: 14px; background: var(--surface); }
.cmp-c.ok { border-color: rgba(115,218,202,.4); } .cmp-c.bad { border-color: rgba(247,118,142,.35); }
.cmp-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cmp-r { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 7px 0 7px 14px; border-left: 2px solid var(--line); margin-left: 10px; }
.cmp-r .side { font: 600 11px var(--mono); color: var(--faint); width: 30px; }
.cmp-res { font-size: 13px; font-weight: 650; }
.cmp-c.ok .cmp-res { color: var(--ok); } .cmp-c.bad .cmp-res { color: var(--bad); }

/* family tree (svg) */
.fam { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.fam svg { flex: none; max-width: 100%; height: auto; }
.fam .e { stroke: var(--line); stroke-width: 1.6; transition: stroke .15s; }
.fam .e.hl { stroke: var(--t-trav); stroke-width: 2.6; }
.fam .n rect { fill: var(--surface-2); stroke: var(--border-2); transition: fill .15s, stroke .15s; }
.fam .n text { fill: var(--text-2); font: 12.5px var(--mono); text-anchor: middle; dominant-baseline: central; }
.fam .n.me rect { fill: var(--accent); stroke: var(--accent); } .fam .n.me text { fill: #0b0e13; font-weight: 700; }
.fam .n.hl rect { fill: rgba(187,154,247,.18); stroke: var(--t-trav); } .fam .n.hl text { fill: #fff; }
.fam-keys { display: flex; flex-direction: column; gap: 8px; min-width: 240px; flex: 1; }
.fam-k { text-align: left; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--surface); cursor: pointer; }
.fam-k:hover, .fam-k.on { border-color: var(--t-trav); background: rgba(187,154,247,.08); }
.fam-k code { background: none; border: 0; padding: 0; font-size: 12.5px; }
.fam-k small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* ---------- "How it works" panels ---------- */
details.explain { margin: -6px 0 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-2); }
details.explain > summary {
  display: flex; align-items: center; gap: 9px; padding: 9px 14px; cursor: pointer; list-style: none; user-select: none;
  font-size: 13.5px; font-weight: 600; color: var(--accent-2);
}
details.explain > summary::-webkit-details-marker { display: none; }
details.explain > summary::after { content: "›"; margin-left: 4px; font-size: 18px; line-height: 1; color: var(--muted); transition: transform .15s; }
details.explain[open] > summary::after { transform: rotate(90deg); }
details.explain > summary:hover { background: rgba(255,255,255,.02); }
.ex-funnel { margin-left: auto; font: 500 12px var(--mono); color: var(--muted); }
.ex-body { padding: 4px 16px 14px; border-top: 1px solid var(--border); }
.ex-h { margin: 14px 0 8px; font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.ex-h .dg-note { text-transform: none; letter-spacing: 0; font-weight: 400; }
.ex-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 6px 0 6px calc(var(--d) * 22px); border-bottom: 1px dashed var(--border); position: relative; }
.ex-row:last-child { border-bottom: 0; }
.ex-row::before { content: ""; position: absolute; left: calc(var(--d) * 22px - 12px); top: 0; bottom: 50%; width: 8px; border-left: 1.5px solid var(--line, #34404f); border-bottom: 1.5px solid var(--line, #34404f); border-bottom-left-radius: 4px; }
.ex-row[style="--d:0"]::before { display: none; }
.ex-code { font: 12.5px var(--mono); padding: 2px 7px; border-radius: 5px; background: var(--code-bg); border: 1px solid var(--border); white-space: pre-wrap; }
.ex-txt { font-size: 13.5px; color: var(--text-2); flex: 1 1 260px; }
.ex-txt code { font-size: 12px; }
.ex-steps { list-style: none; padding: 0; margin: 0; counter-reset: none; }
.ex-step { margin: 0 0 10px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); }
.ex-step.final { border-color: rgba(115,218,202,.4); background: var(--ok-bg); }
.ex-sh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
.ex-n { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-3); font: 600 11.5px var(--mono); color: var(--text-2); flex: none; }
.ex-step.final .ex-n { background: var(--ok); color: #0b0e13; }
.ex-what { color: var(--text); }
.ex-count { margin-left: auto; font: 600 12.5px var(--mono); color: var(--text); }
.ex-step.final .ex-count { color: var(--ok); }
.ex-d { font: 600 11.5px var(--mono); padding: 1px 7px; border-radius: 5px; }
.ex-d.down { color: var(--bad); background: var(--bad-bg); } .ex-d.up { color: var(--warn); background: var(--warn-bg); } .ex-d.same { color: var(--muted); background: var(--surface-2); font-weight: 400; }
.ex-bar { height: 5px; margin: 9px 0 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.ex-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--violet)); }
.ex-step.final .ex-bar i { background: var(--ok); }
.ex-expr { margin: 0 0 8px; padding: 7px 10px; border-radius: 7px; background: var(--code-bg); border: 1px solid var(--border); overflow-x: auto; font: 12.5px/1.5 var(--mono); color: #cdd6e3; }
.ex-expr code { background: none; border: 0; padding: 0; font: inherit; }
.ex-locs, .ex-gone { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.ex-loc { font-size: 11.5px; padding: 1px 6px; }
.ex-gone { margin-top: 7px; }
.ex-gone > span { font-size: 11.5px; color: var(--faint); margin-right: 2px; }
.ex-loc.out { text-decoration: line-through; opacity: .55; border-color: rgba(247,118,142,.35); color: var(--bad); }

/* responsive */
@media (max-width: 1240px) {
  #app { grid-template-columns: var(--sw) minmax(0,1fr); }
  #toc { display: none; }
}
@media (max-width: 900px) {
  #app, body.side-collapsed #app { grid-template-columns: minmax(0,1fr); }
  body.side-collapsed #sidebar { visibility: visible; }
  #collapse-btn { display: none; }
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: min(var(--side-w), 86vw); z-index: 45; transform: translateX(-102%); transition: transform .22s; }
  body.side-open #sidebar { transform: none; box-shadow: 24px 0 60px rgba(0,0,0,.5); }
  #menu-btn { display: inline-grid; }
  #topbar { padding: 0 12px; }
  #content { padding: 24px 16px 32px; }
  .doc-head h1 { font-size: 27px; }
  .hero h1 { font-size: 30px; }
  #content h2 { font-size: 21px; flex-wrap: wrap; }
  .entry-card { padding: 2px 14px 4px; }
  figure.code pre { padding: 12px 14px; font-size: 12.5px; }
  .pill .pl-t { display: none; }
  .cb-btn .lbl { display: none; }
}

<script>
const DATA = /*__LAB_DATA__*/null;
(() => {
"use strict";

/* ================= data ================= */

const GROUPS = [[1, 1, "Foundations"], [2, 4, "Node matchers"], [5, 7, "Narrowing matchers"], [8, 10, "Traversal matchers"], [11, 12, "Beyond C++ & capstone"]];
const groupOf = n => GROUPS.find(g => n >= g[0] && n <= g[1])[2];

const CAT = {};
for (const [name, rows] of Object.entries(DATA.catalog)) CAT[name] = rows[0].s;
const sampleByBase = {};
for (const p of Object.keys(DATA.samples)) {

}

/* ================= storage ================= */
const store = {

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const stripMd = s => s.replace(/`/g, "").replace(/\*\*/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");

}
async function copyText(text) {

/* ================= outline / slugs ================= */
function makeSlugger() {
  const seen = {};
  return text => {
    let m, base;
    if ((m = text.match(/^(\d+)\.(\d+)\b/))) base = `sec-${m[1]}-${m[2]}`;
    else if ((m = text.match(/^`([A-Za-z_]\w*)\(/))) base = m[1];
    else base = stripMd(text).toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") || "h";
    if (seen[base]) { seen[base]++; return `${base}-${seen[base]}`; }
    seen[base] = 1; return base;
  };
}
const FENCE_OPEN = /^(\s*)(`{3,}|~{3,})\s*([\w+-]*)\s*$/;
const FENCE_CLOSE = /^\s*(`{3,}|~{3,})\s*$/;
function outline(doc) {
  if (doc._ol) return doc._ol;
  const sl = makeSlugger(), out = [];

  for (const line of doc.md.split("\n")) {
    if (fence) { if (FENCE_CLOSE.test(line)) fence = null; continue; }
    if (FENCE_OPEN.test(line)) { fence = true; continue; }
    const m = line.match(/^(#{1,4})\s+(.*?)\s*$/);
    if (!m) continue;
    const h = { lvl: m[1].length, text: m[2], id: sl(m[2]) };
    if (h.lvl === 2) { sec = h; const n = h.text.match(/^(\d+\.\d+)\b/); h.sec = n ? n[1] : null; }
    if (h.lvl === 3) h.parent = sec;
    out.push(h);
  }

}
const sectionsOf = doc => outline(doc).filter(h => h.lvl === 2 && h.sec);

const ENTRIES = {};
for (const d of parts) for (const h of outline(d)) {
  const m = h.lvl === 3 && h.text.match(/^`([A-Za-z_]\w*)\(/);
  if (m) (ENTRIES[m[1]] ||= []).push({ doc: d, id: h.id, sec: h.parent });
}

/* ================= highlighters ================= */
// each returns [[cls, text, matcherName?], ...]
const CQ_CMDS = new Set(["match", "m", "let", "l", "set", "enable", "disable", "help", "quit", "q", "unlet"]);
const CQ_VALS = new Set(["AsIs", "IgnoreUnlessSpelledInSource", "print", "diag", "dump", "detailed-ast", "srcloc", "true", "false", "output"]);
const catCls = c => c === "node" ? "t-node" : c === "narrowing" ? "t-narrow" : c === "traversal" ? "t-trav" : "t-fn";

function hlCQ(code) {
  const toks = [], lets = new Set();
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"?)|(\n)|([A-Za-z_]\w*(?:-[A-Za-z]\w*)*)|(\d+(?:\.\d+)?)|([ \t]+)|([\s\S])/g;
  let m, lineStart = true, indented = false, cmd = null, argPos = 0, prev = "";
  while ((m = re.exec(code))) {
    const [t, com, str, nl, id, num, ws] = m;
    if (nl) { toks.push(["", t]); lineStart = true; indented = false; continue; }
    if (ws) { if (lineStart) indented = true; toks.push(["", t]); continue; }
    const first = lineStart; lineStart = false;
    if (com) { toks.push(["t-com", t]); continue; }
    if (str) { toks.push(["t-str", t]); prev = t; continue; }
    if (num) { toks.push(["t-num", t]); prev = t; continue; }
    if (id) {
      const after = code.slice(re.lastIndex).match(/^\s*(\S)/);
      const call = after && after[1] === "(";
      let cls = "", mname;
      if (first && !indented && CQ_CMDS.has(t)) { cls = "t-cmd"; cmd = t; argPos = 0; }
      else if ((cmd === "set" || cmd === "enable" || cmd === "disable") && !call) { cls = argPos === 0 ? "t-opt" : "t-val"; argPos++; }
      else if ((cmd === "let" || cmd === "l") && argPos === 0 && !call) { cls = "t-var"; lets.add(t); argPos++; }
      else if (prev === ".") cls = "t-meth";
      else if (CAT[t]) { cls = catCls(CAT[t]); mname = t; }
      else if (lets.has(t)) cls = "t-var";
      else if (call) cls = "t-fn";
      else if (CQ_VALS.has(t) && cmd) cls = "t-val";
      toks.push([cls, t, mname]); prev = t; continue;
    }
    toks.push(["", t]); prev = t;
  }

}

const CPP_KW = new Set(("alignas alignof asm auto break case catch class concept const consteval constexpr constinit const_cast continue co_await co_return co_yield decltype default delete do dynamic_cast else enum explicit export extern false final for friend goto if inline module import mutable namespace new noexcept nullptr operator override private protected public register reinterpret_cast requires return sizeof static static_assert static_cast struct switch template this thread_local throw true try typedef typeid typename union using virtual volatile while restrict _Alignas _Atomic _Generic _Noreturn _Static_assert __attribute__ __declspec __global__ __device__ __host__ __shared__ __constant__ __block __kindof nil YES NO self super in out inout oneway").split(" "));
const CPP_TYPES = new Set(("void bool char char8_t char16_t char32_t wchar_t short int long float double signed unsigned size_t ptrdiff_t id SEL BOOL Class instancetype dim3 _Accum _Fract _Sat _Complex int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t").split(" "));
function hlCPP(code) {
  const toks = [];
  const re = /(\/\/[^\n]*)|(\/\*[\s\S]*?(?:\*\/|$))|(^[ \t]*#[^\n]*)|(@?"(?:[^"\\\n]|\\.)*"?)|('(?:[^'\\\n]|\\.)*'?)|(\b0[xX][\da-fA-F']+\w*|\b\d[\d'.]*(?:[eE][+-]?\d+)?\w*)|(@?[A-Za-z_]\w*)|(\s+)|([\s\S])/gm;
  let m;
  while ((m = re.exec(code))) {
    const [t, lc, bc, pp, str, chr, num, id] = m;
    if (lc || bc) toks.push(["t-com", t]);
    else if (pp) toks.push(["t-pp", t]);
    else if (str || chr) toks.push(["t-str", t]);
    else if (num) toks.push(["t-num", t]);
    else if (id) {
      let cls = "";
      if (id[0] === "@" || CPP_KW.has(id)) cls = "t-kw";
      else if (CPP_TYPES.has(id)) cls = "t-type";
      else if (/^\s*\(/.test(code.slice(re.lastIndex))) cls = "t-fn";
      else if (/^[A-Z][a-z]/.test(id)) cls = "t-type";
      toks.push([cls, t]);
    } else toks.push(["", t]);
  }
  return toks;
}

const SH_KW = new Set(["export", "cd", "if", "then", "else", "fi", "for", "do", "done", "while", "in", "case", "esac", "source"]);
function hlSH(code) {
  const toks = [];
  const re = /(#[^\n]*)|('[^']*'?)|("(?:[^"\\]|\\.)*"?)|(\$\()|(\n)|(&&|\|\||[|;])|([^\s'"|;&()]+)|([ \t]+)|([\s\S])/g;
  let m, cmdPos = true, cont = false;
  while ((m = re.exec(code))) {
    const [t, com, sq, dq, sub, nl, op, word, ws] = m;
    if (com) {
      const pc = code[m.index - 1];
      if (m.index === 0 || /\s/.test(pc)) { toks.push(["t-com", t]); continue; }
    }
    if (sq || dq) { toks.push(["t-str", t]); cmdPos = false; continue; }
    if (sub) { toks.push(["t-var", t]); cmdPos = true; continue; }
    if (nl) { toks.push(["", t]); if (!cont) cmdPos = true; cont = false; continue; }
    if (op) { toks.push(["t-kw", t]); cmdPos = true; continue; }
    if (ws) { toks.push(["", t]); continue; }
    const w = word || t;
    if (w === "\\") { toks.push(["", w]); cont = true; continue; }
    cont = false;
    let cls = "";
    if (cmdPos && SH_KW.has(w)) cls = "t-kw";
    else if (cmdPos) { cls = "t-cmd"; cmdPos = false; }
    else if (w[0] === "$") cls = "t-var";
    else if (/^--?[A-Za-z]/.test(w)) cls = "t-flag";
    else if (/^\d+$/.test(w)) cls = "t-num";
    if (cls === "t-kw" && w !== "export" && w !== "cd") cmdPos = true;
    else if (cls === "t-kw") cmdPos = false;
    toks.push([cls, w]);
  }
  return toks;
}

function highlight(code, lang) {
  if (lang === "clang-query" || lang === "query") return hlCQ(code);
  if (lang === "bash" || lang === "sh" || lang === "shell") return hlSH(code);
  if (/^(cpp|c\+\+|c|objc|objective-c|cuda|m|cu|cppm|h)$/.test(lang)) return hlCPP(code);
  if (lang === "text" && /\b[a-z][A-Za-z]*\(/.test(code) && Object.keys(CAT).some(n => code.includes(n + "("))) return hlCQ(code);
  return [["", code]];
}
const spanOf = ([c, t, mn]) => c ? `<span class="${c}"${mn ? ` data-m="${mn}"` : ""}>${esc(t)}</span>` : esc(t);
const toksHtml = toks => toks.map(spanOf).join("");
function toksLines(toks) {
  const lines = [[]];
  for (const [c, t, mn] of toks) {
    t.split("\n").forEach((p, i) => { if (i) lines.push([]); if (p) lines[lines.length - 1].push(spanOf([c, p, mn])); });

/* ================= markdown ================= */
const CODES = [];
const isBlockStart = l =>
  FENCE_OPEN.test(l) || /^#{1,6}\s/.test(l) || /^\s*>/.test(l) || /^\s*([-*+]|\d+[.)])\s+/.test(l) ||
  /^\s*\|/.test(l) || /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l);

function renderBlocks(lines, ctx) {
  const out = [];
  let i = 0, m;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    if ((m = line.match(FENCE_OPEN))) {
      const ind = m[1].length, buf = []; i++;
      while (i < lines.length && !FENCE_CLOSE.test(lines[i])) { buf.push(lines[i].slice(Math.min(ind, indentOf(lines[i])))); i++; }

      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { out.push(renderHeading(m[1].length, m[2], ctx)); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*> ?/, "")); i++; }
      out.push(renderQuote(buf, ctx));
      continue;
    }

      const rows = [line]; i += 2; const sep = lines[i - 1];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push(renderTable(rows, sep, ctx));
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) { const r = renderList(lines, i, ctx); out.push(r.html); i = r.i; continue; }
    const buf = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) buf.push(lines[i++]);
    out.push(renderPara(buf.join("\n"), ctx));
  }

}

function renderHeading(lvl, text, ctx) {
  if (ctx.depth > 0) return `<h${Math.max(lvl, 4)}>${inline(text, ctx)}</h${Math.max(lvl, 4)}>`;
  const id = ctx.slug(text);
  if (lvl === 1) {
    const m = text.match(/^(Part \d+)\s*[—-]\s*(.*)$/);
    ctx.h1 = true;
    return `<header class="doc-head"><div class="eyebrow">${m ? esc(m[1]) : "AST Matchers Lab"}</div><h1 id="${id}">${inline(m ? m[2] : text, ctx)}</h1><div class="doc-meta" id="doc-meta"></div></header>`;
  }
  const href = `#/${ctx.doc.slug}/${id}`;
  if (lvl === 2) {
    const m = text.match(/^(\d+\.\d+)\s*[—-]\s*(.*)$/);
    const body = m ? `<span class="sec-num">${m[1]}</span>${inline(m[2], ctx)}` : inline(text, ctx);
    const btn = m ? `<button class="done-btn${done[m[1]] ? " on" : ""}" data-sec="${m[1]}"><span class="box"></span>Done</button>` : "";
    return `<h2 id="${id}"${m ? ` data-sec="${m[1]}"` : ""}><span class="h-text">${body}<a class="anchor" href="${href}">#</a></span>${btn}</h2>`;
  }
  if (lvl === 3) {
    const m = text.match(/^`([^`]+)`\s*[—-]\s*(.*)$/);
    if (m) {
      const name = (m[1].match(/^([A-Za-z_]\w*)/) || [])[1];
      const cat = CAT[name];
      return `<h3 class="entry" id="${id}"><code class="sig">${toksHtml(hlCQ(m[1]))}</code><span class="ret">${esc(m[2])}</span>${cat ? `<span class="cat-tag ${cat}">${cat}</span>` : ""}<a class="anchor" href="${href}">#</a></h3>`;
    }
  }
  return `<h${lvl} id="${id}">${inline(text, ctx)}<a class="anchor" href="${href}">#</a></h${lvl}>`;
}

const CALLOUT_ICON = {
  hint: '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  success: '<path d="M20 6 9 17l-5-5"/>',
  warning: '<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  note: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  example: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',

function renderQuote(buf, ctx) {

  const icon = `<svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${CALLOUT_ICON[type] || CALLOUT_ICON.note}</svg>`;
  const cls = `callout callout-${type}`;
  if (m[2]) return `<details class="${cls}"${m[2] === "+" ? " open" : ""}><summary>${icon}${inline(title, ctx)}</summary><div class="callout-body">${inner}</div></details>`;

function splitRow(line) {
  let s = line.trim();

    if (ch === "`") { let n = 0; while (s[i] === "`") { n++; i++; } cur += "`".repeat(n); tick = tick === 0 ? n : tick === n ? 0 : tick; continue; }
    if (ch === "|" && !tick) { cells.push(cur.trim()); cur = ""; i++; continue; }
    cur += ch; i++;
  }
  cells.push(cur.trim());

}
function renderTable(rows, sep, ctx) {
  const al = splitRow(sep).map(c => /^:-+:$/.test(c) ? "center" : /-:$/.test(c) ? "right" : "");

  const head = splitRow(rows[0]).map((c, j) => cell("th", c, j)).join("");
  const body = rows.slice(1).map(r => `<tr>${splitRow(r).map((c, j) => cell("td", c, j)).join("")}</tr>`).join("\n");
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderList(lines, i, ctx) {
  const ITEM = /^(\s*)([-*+]|\d+[.)])(\s+)(.*)$/;

function renderPara(text, ctx) {

function oneShot({ code, sample }) {
  const cmds = [];
  for (const line of code.split("\n")) {
    if (!line.trim() || /^\s*#/.test(line)) continue;
    const w = line.trim().split(/\s+/)[0];
    if (cmds.length && (/^\s/.test(line) || !CQ_CMDS.has(w))) cmds[cmds.length - 1] += "\n" + line;
    else cmds.push(line);
  }
  const q = s => "'" + s.replace(/'/g, "'\\''") + "'";
  return `$LLVM/bin/clang-query ${cmds.map(c => "-c " + q(c)).join(" ")} ${sample.file} -- ${sample.flags}`.replace(/\s+$/, "");
}

const FILEREF = /^((?:[\w.-]+\/)*[\w-]+\.(?:cpp|cppm|c|m|cu|h|query))(?::(\d+)(?:[-–](\d+))?(?::\d+)?)?$/;
function codeSpan(code, ctx) {

    if (f) return `<code class="fileref" data-file="${esc(f)}"${m[2] ? ` data-line="${m[2]}"` : ""}${m[3] ? ` data-end="${m[3]}"` : ""} title="Open in sample viewer">${esc(code)}</code>`;
  }
  if ((m = code.match(/^([A-Za-z_]\w*)(\(|$)/)) && CAT[m[1]]) {
    if (m[2] === "(") return `<code>${toksHtml(hlCQ(code))}</code>`;
    const e = ctx.doc.slug === "index" && ENTRIES[m[1]];
    const inner = `<code class="mref ${catCls(CAT[m[1]])}" data-m="${m[1]}">${esc(code)}</code>`;
    return e ? `<a href="#/${e[0].doc.slug}/${e[0].id}">${inner}</a>` : inner;
  }

}

function linkHref(text, href) {
  if (/^https?:/.test(href)) return { href, ext: true };
  const [file] = href.split("#");
  const d = byFile[file.split("/").pop()];
  if (d) {
    const s = text.match(/§(\d+)\.(\d+)/);
    return { href: `#/${d.slug}${s ? `/sec-${s[1]}-${s[2]}` : ""}` };
  }
  return { href };
}
function inline(src, ctx) {
  const ph = [];
  const hold = h => "\u0000" + (ph.push(h) - 1) + "\u0000";
  let s = src.replace(/(`+)(?!`)([\s\S]*?[^`])\1(?!`)/g, (_, t, code) => hold(codeSpan(code.replace(/^ ([\s\S]*) $/, "$1"), ctx)));
  s = s.replace(/\\([\\`*_{}\[\]()#+\-.!|<>])/g, (_, c) => hold(esc(c)));
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
    const l = linkHref(text, href.replace(/&amp;/g, "&"));
    return hold(`<a href="${esc(l.href)}"${l.ext ? ' target="_blank" rel="noopener"' : ""}>${text}</a>`);
  });
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:])/g, (_, pre, url) => pre + hold(`<a href="${url}" target="_blank" rel="noopener">${url}</a>`));
  s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\w*])\*(?=\S)([^*]*?\S)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g, "$1<em>$2</em>");
  for (let k = 0; k < 4 && s.includes("\u0000"); k++) s = s.replace(/\u0000(\d+)\u0000/g, (_, n) => ph[n]);
  return s;
}

/* ================= diagrams ================= */

const pill = (c, ann) => {

const cq = t => `<code class="dg-code">${toksHtml(hlCQ(t))}</code>`;
const cpp = t => `<code class="dg-code">${toksHtml(hlCPP(t))}</code>`;

const CLASS_TOK = /(@?[A-Z][\w*]*)|(\([^()]*\))|(\s*(?:──+|─|>)\s*)|(\s*[·\/,|]\s*)|(…)|(\s+)/g;
function isClasses(t) {

  const names = t.replace(/\([^()]*\)/g, "").match(/@?[A-Z][\w*]*/g) || [];

}

    if (c) { const h = pill(c, annFirst && first); first = false; return h; }
    if (par) return note(par);
    if (arr) return `<span class="dg-arr">${arr.includes(">") ? "›" : "⟶"}</span>`;
    if (sep) return `<span class="dg-sep">${esc(sep.trim())}</span>`;

}
// "─pointee─▶ ParenType ─▶ FunctionProtoType" style chains
function chain(t) {

    arr ? `<span class="dg-arr">${lbl ? `<i class="dg-note">${esc(lbl)}</i> ` : ""}⟶</span>` : c ? (CLASSY.test(c) || nodeMatcher(c) ? pill(c) : esc(c)) : `<span class="dg-txt">${esc(txt)}</span>`);
}
const isMatcherish = t => { const m = t.match(/^\.?([a-z]\w*)/); return !!m && (!!CAT[m[1]] || m[1] === "bind"); };

  if ((m = t.match(/^◄─+\s*(.*)$/))) return `<span class="dg-arr">⟵</span>${m[1] ? note(m[1]) : ""}`;
  if (/^(─+[▶►>]|-+>|=>|─{2,})$/.test(t)) return '<span class="dg-arr">⟶</span>';
  if (t === "✓") return '<span class="dg-ok">✓</span>';
  if (t === "✗") return '<span class="dg-bad">✗</span>';
  if (t === "…") return '<span class="dg-muted">…</span>';
  if (/^\([A-Za-z][^()]*\)$/.test(t)) return note(t);
  if ((m = t.match(FILEREF)) && resolveSample(m[1])) return codeSpan(t, { doc: current || bySlug.home });
  if (/^\d+$/.test(t)) return `<span class="dg-num">${t}</span>`;
  if (/^Matcher<.*>$/.test(t)) return `<code class="dg-code">${esc(t)}</code>`;
  if (isClasses(t)) return classesHtml(t);
  if ((m = t.match(/^([A-Z][\w*]*)\s+([a-z_]\w*)$/)) && (CLASSY.test(m[1]) || nodeMatcher(m[1]))) return pill(m[1]) + " " + cpp(m[2]);
  if (isMatcherish(t)) return cq(t);
  if (isCodeish(t)) return cpp(t);
  if (head && /^[a-z][a-z ]*$/.test(t)) return `<span class="dg-grp">${esc(t)}</span>`;

const chunksHtml = t => t.split(/\s{2,}/).map(c => chunkHtml(c)).join(" ");

function dgFigure(kind, body, raw, tools = "") {

/* --- trees --- */
function parseTree(lines) {
  const roots = [], stack = [];
  for (const raw of lines) {
    if (!raw.trim()) continue;
    const m = raw.match(/^([\s│|]*)([├└]─*\s*)?(.*)$/);
    const node = { text: m[3], kids: [], col: m[1].length + (m[2] || "").length };
    while (stack.length && stack[stack.length - 1].col >= node.col) stack.pop();
    (stack.length ? stack[stack.length - 1].kids : roots).push(node);
    stack.push(node);
  }
  return roots;
}
const countDesc = n => n.kids.reduce((a, k) => a + 1 + countDesc(k), 0);
function treeNodeHtml(n) {
  const chunks = n.text.split(/\s{2,}/).filter(Boolean);
  const ann = chunks.slice(1).some(c => { const m = c.trim().match(/^([a-z]\w*)\(\)$/); return m && CAT[m[1]]; });
  const head = chunks[0] || "";
  const headHtml = isClasses(head) ? classesHtml(head, ann) : chunkHtml(head, true);
  const extras = chunks.slice(1).map(c => chunkHtml(c)).join("");
  const tw = n.kids.length ? `<button class="tw" aria-label="Toggle"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>` : '<span class="tw-sp"></span>';
  const cnt = n.kids.length ? `<span class="tw-n">+${countDesc(n)}</span>` : "";
  return `<li><div class="tn">${tw}${headHtml}${extras}${cnt}</div>${n.kids.length ? `<ul>${n.kids.map(treeNodeHtml).join("")}</ul>` : ""}</li>`;
}
function treeFigure(caption, treeText, raw, extra = "") {
  const tools = '<button class="cb-btn" data-dg="expand">Expand all</button><button class="cb-btn" data-dg="collapse">Collapse</button>';
  const cap = caption ? `<div class="dg-caption">${caption}</div>` : "";
  return dgFigure("tree", `${cap}<ul class="tree">${parseTree(treeText.split("\n")).map(treeNodeHtml).join("")}</ul>${extra}`, raw, tools);
}

/* --- aligned-column tables --- */
function tableFigure(lines, raw) {
  lines = lines.filter(l => l.trim());
  const isSep = l => /^[\s─\-=━]+$/.test(l) && /[─\-=━]{3,}/.test(l);
  const chunksOf = l => [...l.matchAll(/\S+(?: \S+)*/g)].map(m => ({ s: m.index, t: m[0] }));
  let bounds = null, header = null;
  const si = lines.findIndex(isSep);
  if (si > 0) bounds = [...lines[si].matchAll(/[─\-=━]+/g)].map(m => m.index);
  const body = lines.filter(l => !isSep(l));
  if (!bounds || bounds.length < 2) {
    const multi = body.filter(l => chunksOf(l).length >= 2);
    if (multi.length < 2 || multi.length < body.length / 2) return null;
    const w = Math.max(...multi.map(l => l.length)), blank = Array(w).fill(true);
    multi.forEach(l => { for (let i = 0; i < l.length; i++) if (l[i] !== " ") blank[i] = false; });
    const first = blank.indexOf(false);
    bounds = [first];
    for (let i = first; i < w;) {
      if (!blank[i]) { i++; continue; }
      let j = i; while (j < w && blank[j]) j++;
      if (j - i >= 2 && j < w) bounds.push(j);
      i = j;
    }
    if (bounds.length < 2) return null;
  }
  const cutLine = l => {
    const cuts = [0];
    for (let k = 1; k < bounds.length; k++) {
      let b = Math.max(bounds[k], cuts[k - 1]);
      if (b < l.length && l[b - 1] !== " " && l[b] !== " ") {
        let ws = b; while (ws > 0 && l[ws - 1] !== " ") ws--;
        if (b - ws <= 2 && ws > cuts[k - 1]) b = ws; else { while (b < l.length && l[b] !== " ") b++; }
      }
      cuts.push(b);
    }
    cuts.push(Infinity);
    return cuts.slice(0, -1).map((c, k) => l.slice(c, cuts[k + 1]));
  };
  const rows = [];
  for (const l of lines) {
    if (isSep(l)) { if (rows.length === 1 && !header) header = rows.pop(); continue; }
    const raw = cutLine(l), cells = raw.map(c => c.trim());
    const ind = (raw[0].slice(bounds[0]).match(/^ */) || [""])[0].length;
    const prev = rows[rows.length - 1];
    if (prev && cells[0] && ind > 0 && ind < raw[0].length - bounds[0]) {
      cells.forEach((c, k) => { if (c) prev.cells[k] = prev.cells[k] ? prev.cells[k] + "\n" + c : c; });
      continue;
    }
    if (prev && !cells[0]) {
      if (cells.every((c, k) => !c || !prev.cells[k])) { cells.forEach((c, k) => { if (c) prev.cells[k] = c; }); continue; }
      rows.push({ cells, cont: true }); continue;
    }
    rows.push({ cells });
  }
  if (!header && rows.length > 2 && rows[0].cells.filter(Boolean).every(c => /^[A-Za-z][A-Za-z ]*$/.test(c)) &&
      rows.slice(1).some(r => r.cells.some(c => !/^[A-Za-z][A-Za-z ]*$/.test(c)))) header = rows.shift();
  const n = bounds.length;
  const cellHtml = t => (t || "").includes("\n") && isMatcherish(t) ? cq(t.replace(/\n/g, "\n  ")) : (t || "").split("\n").map(chunksHtml).join("<br>");
  const thead = header ? `<thead><tr>${Array.from({ length: n }, (_, k) => `<th>${esc(header.cells[k] || "")}</th>`).join("")}</tr></thead>` : "";
  const tbody = rows.map(r => `<tr${r.cont ? ' class="cont"' : ""}>${Array.from({ length: n }, (_, k) => `<td>${cellHtml(r.cells[k])}</td>`).join("")}</tr>`).join("");
  return dgFigure("table", `<table class="dg-table">${thead}<tbody>${tbody}</tbody></table>`, raw);
}

/* --- annotated lines ("code   <- note") --- */
function annFigure(lines, raw) {
  const rows = lines.filter(l => l.trim()).map((l, i) => {
    const [code, nt = ""] = l.split(/\s+(?:<-+|←)\s+/);
    const noteHtml = esc(nt).replace(/^(node|narrowing|traversal)\b/, (k) => `<span class="cat-tag ${k}">${k}</span>`);
    return `<div class="ann-code" data-r="${i}">${toksHtml(hlCQ(code.replace(/\s+$/, "")))}</div><span class="ann-arrow" data-r="${i}">${nt ? "⟵" : ""}</span><div class="ann-note" data-r="${i}">${noteHtml}</div>`;
  }).join("");

/* --- hand-built figures for the free-form illustrations --- */

// Built from web/steps.json (scripts/explain_steps.py): the example's matcher
// parsed into a tree, plus clang-query counts as it is rebuilt piece by piece.
const summaryOf = d => {
  const para = (d || "").split(/\n\s*\n/)[0].replace(/\s*\n\s*/g, " ");
  let s = (para.match(/^.*?\.(?=\s|$)/) || [para])[0].replace(/\.$/, "");
  s = s.replace(/^Matches\s+/, "").replace(/^1\)\s*/, "");
  return s ? s[0].toUpperCase() + s.slice(1) : "";
};
const innerType = t => ((t || "").match(/Matcher<([\w|]+)>/) || [])[1] || "";
function pickRow(name, frame) {
  const rows = DATA.catalog[name] || [];
  return rows.find(r => frame && innerType(r.r) === frame) || rows[0];
}
function explainRows(n, depth, frame, parentCat, out) {
  if (n.lit != null) return;
  if (n.var) {
    out.push({ depth, code: n.name, cat: "", text: `the matcher defined earlier with <code>let ${esc(n.name)}</code>` });
  } else {
    const row = pickRow(n.name, frame), cat = row ? row.s : "";
    const lits = n.args.map(a => a.lit != null ? a.lit : "…").join(", ");
    const sum = row ? summaryOf(row.d) : "";
    let text, next = frame;
    if (cat === "node") {
      next = innerType(row.p) || frame;
      text = depth === 0 ? `Start with <b>every ${esc(next)}</b> in the file` : `…which must be a <b>${esc(next)}</b>`;
    } else if (cat === "narrowing") text = `Keep it only if: ${esc(sum)}`;
    else if (cat === "traversal") text = `Step to a related node: ${esc(sum)}`;
    else text = esc(sum);
    if (/^(allOf|anyOf|eachOf|unless|optionally)$/.test(n.name)) text = { allOf: "All of the inner matchers must hold", anyOf: "At least one inner matcher must hold", eachOf: "Report a match for each inner matcher that holds", unless: "Keep it only if the inner matcher does <b>not</b> hold", optionally: "Try the inner matcher; keep the node either way" }[n.name];
    out.push({ depth, code: `${n.name}(${lits})`, cat, text, m: n.name });
    for (const a of n.args) explainRows(a, depth + 1, cat === "traversal" ? "" : next, cat, out);
  }
  if (n.bind) out.push({ depth, code: `.bind(${n.bind})`, cat: "bind", text: `Name this node ${esc(n.bind)} — it is what the output reports for each match` });
}
function explainHtml(key, sample) {
  const ex = DATA.steps && DATA.steps[key];
  if (!ex || !ex.steps.length) return "";
  const rows = [];
  explainRows(ex.tree, 0, "", "", rows);
  const rowsHtml = rows.map(r => `<div class="ex-row" style="--d:${r.depth}"><code class="ex-code">${toksHtml(hlCQ(r.code))}</code>${r.cat && r.cat !== "bind" ? `<span class="cat-tag ${r.cat}">${r.cat}</span>` : ""}<span class="ex-txt">${r.text}</span></div>`).join("");
  const max = Math.max(...ex.steps.map(s => s.count), 1);
  const file = resolveSample(sample.file) || sample.file;
  const chip = (l, cls = "") => {
    const m = l.match(/^(?:(.+):)?(\d+):(\d+)$/);
    const f = m[1] ? resolveSample(m[1]) || m[1] : file;
    return `<code class="fileref ex-loc${cls}" data-file="${esc(f)}" data-line="${m[2]}" title="${esc(f)}:${m[2]}:${m[3]}">${m[1] ? esc(m[1].split("/").pop()) + ":" : ""}${m[2]}</code>`;
  };
  let prev = null;
  const stepsHtml = ex.steps.map((s, i) => {
    const last = i === ex.steps.length - 1;

    let diff = "";

    }
    const cur = new Set(s.locs), gone = prev ? prev.locs.filter(l => !cur.has(l)) : [];
    const locs = s.locs.map(l => chip(l)).join("") + (s.count > s.locs.length ? `<span class="dg-muted"> +${s.count - s.locs.length} more</span>` : "");
    const goneHtml = gone.length && gone.length <= 24 && prev.locs.length >= prev.count ? `<div class="ex-gone"><span>filtered out</span>${[...new Set(gone)].map(l => chip(l, " out")).join("")}</div>` : "";
    prev = s;
    return `<li class="ex-step${last ? " final" : ""}"><div class="ex-sh"><span class="ex-n">${i + 1}</span><span class="ex-what">${what}</span>${diff}<span class="ex-count">${s.count} match${s.count === 1 ? "" : "es"}</span></div>
      <div class="ex-bar"><i style="width:${Math.max(1.5, 100 * s.count / max)}%"></i></div>

  }).join("");
  const funnel = ex.steps.map(s => s.count).join(" → ");
  return `<details class="explain"><summary><svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>How this result is reached<span class="ex-funnel">${esc(funnel)}</span></summary>
    <div class="ex-body"><div class="ex-h">What each matcher does</div><div class="ex-rows">${rowsHtml}</div>

}
